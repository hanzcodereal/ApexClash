name: Build APK Release

# Dijalankan MANUAL saja: tab Actions -> "Build APK Release" -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK Release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Siapkan file APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ApexClash-1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexClash-1.0.0-release
          path: dist/ApexClash-1.0.0.apk
          if-no-files-found: error
